[package]
name = "uhh"
version = "0.1.0"
edition = "2024"
description = "Explains a shell command flag by flag, from the man pages already on your machine. Offline explainshell for your terminal."
license = "MIT"
repository = "https://github.com/Oliv3rmoon/uhh"
readme = "README.md"
keywords = ["cli", "shell", "explainshell", "man", "terminal"]
categories = ["command-line-utilities"]

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
crossterm = "0.29.0"
shell-words = "1.1.1"
